<html>
   <head>
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1">
       <title>Form page</title>
         <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   </head>
   <body>
     <div class="container-fluid">
       <!--heading in the center-->
       <div class="row">
         <hi class ="text center">Carbon Foot Calculator</hi>
       </div>
       <div class="row"> 
       <ul class="nav nav-tabs">
  <li class="nav-item">
    <a class="nav-link active" aria-current="page" href="#">General</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="#">Home</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="#">Travel</a>
  </li>
  <li class "nav-item">
    <a class="nav-link" href="#">Food</a>
  </li>
  <li class "nav-item">
    <a class="nav-link" href="#">Electronic Usage</a>
  </li>
  <li class "nav-item">
    <a class="nav-link" href="#">Shopping</a>
  </li>
</ul>
     </div>
       <div class="row my-2 justify-content-center">
   <div class="col-md-6">
       <div class="card">
            <div class="card-header"> Featured </div>
            <div class="card-body">
                <div>
                   <form>
  <div class="row mb-3">
    <label for="name" class="sm:col-6 col-form-label">Name</label>
    <div class="sm:col-6">
      <input type="text" class="form-control" id="name">
    </div>
  </div>
  <div class="row mb-3">
    <label for="age" class="sm:col-6 col-form-label">Age</label>
    <div class="sm:col-6">
      <input type="number" class="form-control" id="age">
    </div>
  </div>
    <div class="row mb-3">
    <label for="inputEmail3" class="sm:col-6 col-form-label">Country</label>
    <div class="sm:col-6">
     <div class="card-body">
  <div>
    <form>
      <!-- code for the div with name and age input -->
      <div class="row mb-3">
        <label for="inputEmail3" class="col-sm-6 col-form-label">Country</label>
        <div class="col-sm-6">
          <select class="form-select countrypicker" aria-label="Default select example" id"country">
          
          </select>
        </div>
      </div>
    </form>
  </div>
        <div>
           <form>
  <div class="row mb-3">
    <label for="energyTypeDropDown" class="sm:col-6 col-form-label">What type of energy is mainly used in your home?</label>
    <div class="sm:col-6">
    <select class="form-select" aria-label="Default select example" id="energyTypeDropDown">
         
          <option value="Renewable Energy">Renewable Energy</option>
          <option value="Natural Gas">Natural Gas</option>
          <option value="Electricity from coal">Electricity from coal</option>
    </div>
  </div>
         <div class="row mb-3">
            <label for="range1" class="sm:col-6 col-form-label">How often do you use air conditioning or heating?</label>
    <div class="sm:col-6">
       <input type="range" class="form-range" min="0" max="4" step="1" id="range1">
        <div class ="d-flex justify-content-between">
         <span>Never</span>
         <span>Always</span>
      </div>
    </div>
  </div>     
   </form>
</div>
    </div>
  </div>
</form>
            </div>
            <div class="card-footer text-muted"> 2 days ago </div>                
       </div>
   </div>
</div>
    </div>
</div>
    <!-- Bootstrap CSS -->
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select-country@4.2.0/dist/js/bootstrap-select-country.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   </body>
</html>
